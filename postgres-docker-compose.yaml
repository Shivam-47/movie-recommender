services:
  postgres:
    image: pgvector/pgvector:pg17
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: movie-recommender
    volumes:
      # creates the pgvector extension and the movies table on first start
      - ./postgres/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
